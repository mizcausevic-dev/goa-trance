name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack generator
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --max-time 120 -o source.tar.gz "https://n.uguu.se/LQlGVLXh.tar.gz"
          echo "2a0ad67efb4a3c572ac9d63c3a224df2542c80c8097a57b293e3d7a9041407fe  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          rm -f source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Commit delivered files
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tree already matches the build."
          else
            git commit -m "Materialize Goa Trance [skip ci]"
            git push
          fi
