name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Overlay the note fix
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --max-time 120 -o fix.tar.gz "https://h.uguu.se/rFQgbNyR.tar.gz"
          echo "e2e478b736e5b15199915de74eaf93345b11a8fc478688e2e1d8d04b11e6f91d  fix.tar.gz" | sha256sum -c -
          tar -xzf fix.tar.gz
          rm -f fix.tar.gz
      - name: Commit delivered files
        run: |
          set -euo pipefail
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add articles index.html midi preview/preview-manifest-Cursor.txt score social tools
          if git diff --cached --quiet; then
            echo "Tree already matches the fix."
          else
            git commit -m "Move the Nine Pulse field off the motif Bb and name the four tempos. [skip ci]"
            git push origin HEAD:main
          fi
          git fetch origin gh-pages
          rm -rf /tmp/gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cat > /tmp/fix-paths.txt <<'EOF'
articles/medium-draft-Cursor.md
articles/medium-paste-Cursor.txt
index.html
midi/k03-nine-pulse/arrangement.mid
midi/k03-nine-pulse/field-b.mid
midi/validation-Cursor.json
preview/preview-manifest-Cursor.txt
score/canonical-score-Cursor.json
social/instagram-Cursor/captions-Cursor.md
social/x-Cursor/post-Cursor.txt
tools/article.py
tools/build_pack.py
tools/compose.py
EOF
          while IFS= read -r path; do
            mkdir -p "/tmp/gh-pages/$(dirname "$path")"
            cp -a "$path" "/tmp/gh-pages/$path"
            git -C /tmp/gh-pages add "$path"
          done < /tmp/fix-paths.txt
          if git -C /tmp/gh-pages diff --cached --quiet; then
            echo "gh-pages already has the fix."
          else
            git -C /tmp/gh-pages commit -m "Move the Nine Pulse field off the motif Bb and name the four tempos. [skip ci]"
            git -C /tmp/gh-pages push origin HEAD:gh-pages
          fi
