name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack generator
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --max-time 120 -o source.tar.gz "https://n.uguu.se/LQlGVLXh.tar.gz"
          echo "2a0ad67efb4a3c572ac9d63c3a224df2542c80c8097a57b293e3d7a9041407fe  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          rm -f source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Commit delivered files
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tree already matches the build."
          else
            git commit -m "Materialize Goa Trance [skip ci]"
            git push
          fi
          git fetch origin gh-pages
          git push origin HEAD:gh-pages || git push origin "${{ github.sha }}:gh-pages" || true
      - name: Publish GitHub Pages from gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh api --method POST "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"; then
              ok=1
              break
            fi
            if gh api --method PUT "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = 1
          gh api --method PUT "repos/${{ github.repository }}/topics" --input - <<'EOF'
          {"names":["midi","goa-trance","trance","music-production","composition"]}
          EOF
